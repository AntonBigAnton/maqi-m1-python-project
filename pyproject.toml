# pinned dependencies (uv or pip)
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maqi-m1-python-project"
version = "0.1.0"
description = "Does perp flow and positioning improve short-horizon spot prediction?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "truststore==0.10.5",
    # models and statistics
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    # figures
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "nb-clean==6.0.0",
    "pytest==9.2.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]